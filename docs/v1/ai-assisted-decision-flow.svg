<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Frontend Reasoning Lab v1 AI-Assisted Decision Summary</title>
  <desc id="desc">A documentation infographic showing the v1 tiny proof flow, owner and AI responsibilities, slice progression, deferred scope, and stop line.</desc>

  <defs>
    <style>
      text {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #172033;
      }
      .eyebrow { font-size: 15px; font-weight: 750; letter-spacing: 2.4px; fill: #315f9e; }
      .title { font-size: 39px; font-weight: 760; letter-spacing: -0.7px; }
      .subtitle { font-size: 18px; font-weight: 450; fill: #5d6b80; }
      .section-label { font-size: 14px; font-weight: 760; letter-spacing: 1.6px; fill: #315f9e; }
      .card-title { font-size: 21px; font-weight: 720; }
      .body { font-size: 16px; font-weight: 470; fill: #435168; }
      .flow-title { font-size: 17px; font-weight: 680; }
      .flow-note { font-size: 13px; font-weight: 520; fill: #65738a; }
      .bullet { font-size: 15px; font-weight: 470; fill: #435168; }
      .slice { font-size: 14px; font-weight: 650; }
      .stop { font-size: 15px; font-weight: 620; fill: #244e86; }
      .card { fill: #ffffff; stroke: #d9e1ec; stroke-width: 1.5; }
      .owner-card { fill: #f7faff; stroke: #8eadd4; stroke-width: 2; }
      .ai-card { fill: #fbfcfe; stroke: #ccd7e5; stroke-width: 1.5; }
      .flow-card { fill: #ffffff; stroke: #aac0dd; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#547fb7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-soft" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 7 4.5 1 8" fill="none" stroke="#9aabc0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f5f7fa"/>
  <rect x="0" y="0" width="12" height="900" fill="#4d79b2"/>

  <g aria-label="Title">
    <text x="64" y="49" class="eyebrow">FRONTEND REASONING LAB v1</text>
    <text x="64" y="94" class="title">AI-Assisted Decision Summary</text>
    <text x="64" y="124" class="subtitle">Tiny proof scope, owner responsibility, and deferred boundaries</text>
    <line x1="64" y1="142" x2="1536" y2="142" stroke="#d7e0eb" stroke-width="1.5"/>
  </g>

  <g aria-label="Goal">
    <rect x="64" y="166" width="1472" height="92" rx="14" class="card"/>
    <rect x="64" y="166" width="8" height="92" rx="4" fill="#4d79b2"/>
    <text x="94" y="196" class="section-label">GOAL</text>
    <text x="94" y="229" class="body">Build one small frontend reasoning proof</text>
    <circle cx="541" cy="224" r="3" fill="#9aabc0"/>
    <text x="559" y="229" class="body">Make state, data flow, and evaluator boundaries visible</text>
    <circle cx="1114" cy="224" r="3" fill="#9aabc0"/>
    <text x="1132" y="229" class="body" style="font-size:15px">Validate one complete loop before expanding scope</text>
  </g>

  <g aria-label="Tiny Proof Flow">
    <text x="64" y="294" class="section-label">TINY PROOF FLOW</text>

    <rect x="64" y="312" width="240" height="86" rx="14" class="flow-card"/>
    <text x="184" y="347" text-anchor="middle" class="flow-title">Fixed question</text>
    <text x="184" y="374" text-anchor="middle" class="flow-note">One controlled prompt</text>

    <rect x="372" y="312" width="240" height="86" rx="14" class="flow-card"/>
    <text x="492" y="347" text-anchor="middle" class="flow-title">User answer</text>
    <text x="492" y="374" text-anchor="middle" class="flow-note">Typed UI input</text>

    <rect x="680" y="312" width="240" height="86" rx="14" class="flow-card"/>
    <text x="800" y="347" text-anchor="middle" class="flow-title">Fake async evaluator</text>
    <text x="800" y="374" text-anchor="middle" class="flow-note">Separate service boundary</text>

    <rect x="988" y="312" width="240" height="86" rx="14" class="flow-card"/>
    <text x="1108" y="347" text-anchor="middle" class="flow-title">Structured result</text>
    <text x="1108" y="374" text-anchor="middle" class="flow-note">Typed feedback data</text>

    <rect x="1296" y="312" width="240" height="86" rx="14" class="flow-card"/>
    <text x="1416" y="347" text-anchor="middle" class="flow-title">UI feedback</text>
    <text x="1416" y="374" text-anchor="middle" class="flow-note">State-driven rendering</text>

    <path d="M316 355H356" stroke="#547fb7" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M624 355H664" stroke="#547fb7" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M932 355H972" stroke="#547fb7" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1240 355H1280" stroke="#547fb7" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
  </g>

  <g aria-label="Responsibility Boundary">
    <rect x="64" y="428" width="720" height="174" rx="16" class="owner-card"/>
    <text x="92" y="460" class="section-label">OWNER RESPONSIBILITY</text>
    <text x="92" y="493" class="bullet">• Final scope decisions</text>
    <text x="92" y="520" class="bullet">• State model and data flow</text>
    <text x="92" y="547" class="bullet">• Component responsibility boundaries</text>
    <text x="432" y="493" class="bullet">• TypeScript contracts</text>
    <text x="432" y="520" class="bullet">• Final review and explanation</text>
    <rect x="688" y="448" width="68" height="26" rx="13" fill="#dce9f8"/>
    <text x="722" y="466" text-anchor="middle" class="flow-note" style="fill:#315f9e;font-weight:700">OWNS</text>

    <rect x="816" y="428" width="720" height="174" rx="16" class="ai-card"/>
    <text x="844" y="460" class="section-label" style="fill:#66778d">AI ASSISTANCE</text>
    <text x="844" y="493" class="bullet">• Scope review</text>
    <text x="844" y="520" class="bullet">• Slice planning</text>
    <text x="844" y="547" class="bullet">• Draft implementation proposals</text>
    <text x="1184" y="493" class="bullet">• Small diff and edge-case review</text>
    <text x="1184" y="520" class="bullet">• Documentation support</text>
    <rect x="1435" y="448" width="73" height="26" rx="13" fill="#e9eef4"/>
    <text x="1471.5" y="466" text-anchor="middle" class="flow-note" style="fill:#66778d;font-weight:700">SUPPORTS</text>
  </g>

  <g aria-label="Slice Progression">
    <rect x="64" y="630" width="1472" height="94" rx="14" class="card"/>
    <text x="92" y="660" class="section-label">SLICE PROGRESSION</text>
    <text x="92" y="698" class="slice">Domain foundation</text>
    <path d="M246 693H316" stroke="#9aabc0" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-soft)"/>
    <text x="344" y="698" class="slice">Thin UI connection</text>
    <path d="M499 693H569" stroke="#9aabc0" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-soft)"/>
    <text x="597" y="698" class="slice">Evaluator rubric</text>
    <path d="M731 693H801" stroke="#9aabc0" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-soft)"/>
    <text x="829" y="698" class="slice">Criteria panel</text>
    <path d="M938 693H1008" stroke="#9aabc0" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-soft)"/>
    <text x="1036" y="698" class="slice">Visible data-flow loop</text>
  </g>

  <g aria-label="Scope Boundary">
    <rect x="64" y="752" width="920" height="116" rx="16" class="card"/>
    <text x="92" y="782" class="section-label">DEFERRED SCOPE</text>
    <text x="92" y="817" class="bullet">No real AI API</text>
    <text x="270" y="817" class="bullet">No multi-question system</text>
    <text x="516" y="817" class="bullet">No login or database</text>
    <text x="730" y="817" class="bullet">No dashboard or analytics</text>
    <text x="92" y="847" class="bullet">No practice history</text>

    <rect x="1016" y="752" width="520" height="116" rx="16" fill="#f5f9ff" stroke="#4d79b2" stroke-width="2.5"/>
    <rect x="1016" y="752" width="8" height="116" rx="4" fill="#4d79b2"/>
    <text x="1044" y="782" class="section-label">STOP LINE</text>
    <text x="1044" y="811" class="stop">Stop after the tiny proof is complete, explainable,</text>
    <text x="1044" y="832" class="stop">and documented.</text>
    <text x="1044" y="857" class="body">New features require a separate scope decision.</text>
  </g>
</svg>
